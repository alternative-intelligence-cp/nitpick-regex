# nregex — the manifest.
#
# The schema is the compiler's (BUILD_REFERENCE.md §1, D-077): four tables plus
# the `[[test]]` array, and `npkg`'s parser refuses a key the schema lacks. It
# is written in full now, ahead of the tool that reads it, because a manifest
# that appears when the tooling arrives is a manifest nobody reviewed.
#
# WHAT CANNOT READ THIS YET. `npkg build` is the compiler's own bootstrap
# ladder — it assembles `runtime/npkrt.ll` and `bootstrap/seed/stage1.ll`, has
# the builder compile `[build] entry`, and names the result `npkc`. There is no
# generic-project path, and `[dependencies]` is parsed but the resolver's root
# list is initialised empty and never populated, so a `use "nregex/…"` path
# resolves against nothing. Until that changes, `harness/` builds this library
# by invoking `npkc`, `llc` and `ld.lld` directly — the same relationship
# `bootstrap/harness/` has to `npkg` in the compiler repo, and it retires the
# same way. See meta/specs/BUILD.md.

[project]
name        = "nregex"
version     = "0.0.0"
description = "Regular expressions for Nitpick — linear time guaranteed, zero dependency"
authors     = ["Randy"]
target      = "library"

[build]
entry     = "src/lib.npk"
output    = "build/libnregex"
# 0 while the library is being built out, matching the compiler's own choice:
# `opt` is not invoked at all, the pipeline stays short, and the emitted IR
# stays readable. The harness re-runs every program through `opt -O2` as a
# CHECK regardless (the 1.3.8 instrument), which is where optimiser divergence
# gets caught — raising this key is a separate decision from running that leg.
opt-level = 0

# THE TOOLCHAIN IS A BUILD INPUT (D-204), pinned to the exact patch release the
# compiler pins, because a patch release may change instruction selection.
# These lists are READ by every `llc`/`opt`/`ld.lld` invocation the harness
# makes; a stated flag nothing consumes is the next stale document.
# *(20.1.8 since cycle 0.2.1a, 2026-10-09 -- RX-231: the compiler's D-349 moved its pin from 20.1.2
# at its landing 99, and compiler `7e91730` carries it.)*
[toolchain]
llvm          = "20.1.8"
# THE TARGET EVERY MODULE STATES (the compiler's E-8, D-322 (5), its landing 71;
# carried since cycle 0.1.0b, RX-176). Every emission opens with a `target
# datalayout` and a `target triple` line, and these two rows are what the runner
# holds them to: `datalayout` to what the pinned `opt` derives from `triple`
# (`harness/toolchain.py`), and every linked program's two lines to both
# (`harness/build.py`). Pins, not settings -- `npkg` refuses a manifest without
# either, by name -- and the layout is the FULL string: `llvm-as` completes a
# partial one, which then fails the belt.
triple        = "x86_64-unknown-linux-gnu"
datalayout    = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
llc-flags     = ["-O0", "-filetype=obj", "-relocation-model=static"]
llc-opt-flags = ["-O2", "-filetype=obj", "-relocation-model=static"]
opt-flags     = ["-O2", "-S"]
lld-flags     = ["-static"]

# EMPTY, AND EMPTY ON PURPOSE. `nregex` depends on the language and its prelude
# and on nothing else — not on the compiler's `src/`, not on `lib/`, not on a
# collections package that does not exist, and not on `nitpick-tui` even though
# both generate Unicode tables from the same UCD (O-X1). Anything added here is
# a zero-dependency decision and has to be argued as one (meta/specs/BUILD.md §4).
[dependencies]

# TEST TARGETS. Each cycle adds its own entries as its suite is created; an
# entry naming a directory with nothing in it is a suite that reports green
# while checking nothing, which is the failure this table exists to prevent.
# The stages are the compiler's (BUILD_REFERENCE §7.1) and the expectation
# grammar lives inside each test file. Suites run in the order written here.

# Cycle 0.0.1's entry, and the only live one. `compile`/`positive` means
# "compiles, links, runs, and exits with the expected code" -- which is what
# this suite needs and what the `accept` stage cannot do (RX-117: `accept` is
# judged by the compiler's own tools/check, which RX-007 forbids importing,
# and it neither links nor runs).
[[test]]
name  = "conformance"
stage = "compile"
kind  = "positive"
path  = "tests/conformance"

# THE PROBE SUITE, SPLIT BY KIND -- RX-119, made good by cycle 0.0.2.
#
# `tests/probe/` held 23 files of two kinds: 16 carry `expect-exit:` and 7 carry
# `expect-error:` -- they are refusals, and being refused is the whole point of
# probe02b, probe09, probe12b and the four probe13s. NO SINGLE ENTRY CAN JUDGE
# THAT. Read in npkg/suites.npk at 950bb1d:
#   * `files_of` (:549) takes `path`/`paths` as DIRECTORIES and lists files by
#     suffix; `recursive` defaults false, so a subdirectory is EXCLUDED -- which
#     is what makes the two entries below disjoint without listing a file.
#   * `run_program` (:779) judges every file it finds, skipping only those
#     imported by another; it does NOT skip a file carrying `expect-error`, so
#     the 7 refusals would have been built as programs and failed.
#   * `run_compile` (:608) does not filter by expectation either -- `kind`
#     selects the checker, not the file set.
#
# So the 7 moved to `tests/probe/refused/`, the compiler's own convention of a
# directory per kind. Cycle 0.0.0's execution record cites their old paths and
# is a verified artifact that is not rewritten; `meta/roadmap/done/0.0/0.0.2.md` has
# the redirect table, in the pattern RX-114 established for the O-G renumbering.

[[test]]
name  = "probe"
stage = "program"
path  = "tests/probe"              # the probes that compile, link and run

[[test]]
name  = "probe-refused"
stage = "compile"
kind  = "negative"
path  = "tests/probe/refused"      # the probes that are refused, each with its exact code set (B-7, D-237)

# CYCLE 0.0.3's TWO ENTRIES.
#
# THE PARSE SWEEP, AND IT IS NOT THE STAGE `BUILD.md` §3 FIRST NAMED (RX-124).
# §3 defined `parse` as "accepted by `tools/parse_check`". That is a
# COMPILER-repository tool whose own first lines are nineteen
# `use "../src/frontend/…"` imports, so having it means compiling the
# compiler's frontend -- which RX-007 forbids depending on and W-18 forbids
# building from here. It is the same reason rule B-4a already gave for
# striking `accept`, one row away in the same table, and `parse` was left
# standing beside it. `npkc` has no parse-only flag (its usage line, read at
# `3d15ac9`). So the sweep is `npkc` itself: STRICTLY STRONGER than parsing,
# because the whole frontend runs and IR is emitted.
#
# WHY IT IS WORTH A SUITE. `src/lib.npk` reaches `src/api/api.npk` and nothing
# else, so SIX of the eight files in `src/` -- core, compile, engine, hir,
# syntax, unicode -- are reached by no other suite in this manifest. They were
# compiled once, at cycle 0.0.1, and nothing re-checked them until this entry.
# `recursive = true` because "every .npk in the tree" is the rule, and these
# three directories are the whole of it (measured: 37 files, 2026-09-04).
[[test]]
name      = "parse"
stage     = "parse"
paths     = ["src", "tests", "harness"]
recursive = true

# THE REJECTION SUITE. `check` is "refused by the frontend with EXACTLY the
# expected codes" (`BUILD.md` §3, B-7, D-237) and the judging is shared with
# `compile`/`negative` rather than copied -- two copies of B-7 would be two
# places for it to weaken.
#
# `tests/probe/refused/` holds refusals about the LANGUAGE; this holds refusals
# about USING THIS LIBRARY. Every fixture imports `src/` by a relative path
# (B-15) -- the two `failsafe_*` ones `src/lib.npk`, and the other nineteen (the
# seal's five since cycle 0.0.4c, `bytes_copy` since the close's fourth triage,
# the five `Vec` and `SparseSet` copies and `bytes_buf_ptr_write` since 0.0.4d,
# and the six loan and pass-out pins and `vec_owning_get_moves_out` since 0.0.4e)
# the `src/core/` modules they test, and since cycle 0.1.0 three the syntax
# layer's entry, `src/syntax/syntax.npk`, and since cycle 0.2.0 one the HIR's,
# `src/hir/hir.npk` (`hir_nodes_read`; the documents audit's RA-4, 2026-10-10)
# -- which makes them the standing
# instance of the B-7 hazard: a typo'd path exits 1 with RESOLVE-005, which is a
# refusal, and only code-set equality tells it from the refusal the test is
# about.
[[test]]
name  = "rejection"
stage = "check"
path  = "tests/rejection"

# CYCLE 0.0.4's ENTRY — the first suite in this manifest whose subject is this
# LIBRARY'S OWN CODE rather than the language or the public surface.
#
# `program` because these files are built, linked, RUN and judged by their exit
# codes, and because rule B-3 then runs every one of them a second time through
# `opt -O2` — which is where an optimiser divergence in a container's pointer
# arithmetic would show up, and the only place it would.
#
# THREE KINDS OF FILE LIVE HERE AND THE MIX IS DELIBERATE:
#   * the in-range suites, `expect-exit: 0`;
#   * the out-of-range cases, `expect-exit: 94` — one per file, because a
#     trapping call cannot be followed by an assertion in the same program;
#   * the managed-half PAIRS, which carry `mem-cap-mib:` and are required to end
#     DIFFERENTLY under the same cap. `exit 0` cannot see a managed body
#     (`SAFETY.md` §8b, S-22), so those two files are the only gate on half of
#     this cycle's memory obligations.
#     (Since cycle 0.1.1b the `Vec` pair is retired -- `Vec<T: Copy>` holds
#     nothing managed, RX-188 -- and the pair left, `bytes_copy_string_empty`
#     and `_nonempty`, ends 0 in both halves since `c3bdae2` fixed the leak its
#     empty half caught; that half reddens if the leak returns.)
# All three are `expect-exit:` files, so one entry judges them all -- which is
# what RX-119 found was NOT true of the probe directory.
[[test]]
name  = "unit"
stage = "program"
path  = "tests/unit"
