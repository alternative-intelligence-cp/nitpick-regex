# nregex — the manifest.
#
# The schema is the compiler's (BUILD_REFERENCE.md §1, D-077): four tables plus
# the `[[test]]` array, and `npkg`'s parser refuses a key the schema lacks. It
# is written in full now, ahead of the tool that reads it, because a manifest
# that appears when the tooling arrives is a manifest nobody reviewed.
#
# WHAT CANNOT READ THIS YET. `npkg build` is the compiler's own bootstrap
# ladder — it assembles `runtime/npkrt.ll` and `bootstrap/seed/stage1.ll`, has
# the builder compile `[build] entry`, and names the result `npkc`. There is no
# generic-project path, and `[dependencies]` is parsed but the resolver's root
# list is initialised empty and never populated, so a `use "nregex/…"` path
# resolves against nothing. Until that changes, `harness/` builds this library
# by invoking `npkc`, `llc` and `ld.lld` directly — the same relationship
# `bootstrap/harness/` has to `npkg` in the compiler repo, and it retires the
# same way. See meta/specs/BUILD.md.

[project]
name        = "nregex"
version     = "0.0.0"
description = "Regular expressions for Nitpick — linear time guaranteed, zero dependency"
authors     = ["Randy"]
target      = "library"

[build]
entry     = "src/lib.npk"
output    = "build/libnregex"
# 0 while the library is being built out, matching the compiler's own choice:
# `opt` is not invoked at all, the pipeline stays short, and the emitted IR
# stays readable. The harness re-runs every program through `opt -O2` as a
# CHECK regardless (the 1.3.8 instrument), which is where optimiser divergence
# gets caught — raising this key is a separate decision from running that leg.
opt-level = 0

# THE TOOLCHAIN IS A BUILD INPUT (D-204), pinned to the exact patch release the
# compiler pins, because a patch release may change instruction selection.
# These lists are READ by every `llc`/`opt`/`ld.lld` invocation the harness
# makes; a stated flag nothing consumes is the next stale document.
[toolchain]
llvm          = "20.1.2"
llc-flags     = ["-O0", "-filetype=obj", "-relocation-model=static"]
llc-opt-flags = ["-O2", "-filetype=obj", "-relocation-model=static"]
opt-flags     = ["-O2", "-S"]
lld-flags     = ["-static"]

# EMPTY, AND EMPTY ON PURPOSE. `nregex` depends on the language and its prelude
# and on nothing else — not on the compiler's `src/`, not on `lib/`, not on a
# collections package that does not exist, and not on `nitpick-tui` even though
# both generate Unicode tables from the same UCD (O-X1). Anything added here is
# a zero-dependency decision and has to be argued as one (meta/specs/BUILD.md §4).
[dependencies]

# TEST TARGETS. Each cycle adds its own entries as its suite is created; an
# entry naming a directory with nothing in it is a suite that reports green
# while checking nothing, which is the failure this table exists to prevent.
# The stages are the compiler's (BUILD_REFERENCE §7.1) and the expectation
# grammar lives inside each test file. Suites run in the order written here.

# Cycle 0.0.1's entry, and the only live one. `compile`/`positive` means
# "compiles, links, runs, and exits with the expected code" -- which is what
# this suite needs and what the `accept` stage cannot do (RX-117: `accept` is
# judged by the compiler's own tools/check, which RX-007 forbids importing,
# and it neither links nor runs).
[[test]]
name  = "conformance"
stage = "compile"
kind  = "positive"
path  = "tests/conformance"

# THE PROBE SUITE, SPLIT BY KIND -- RX-119, made good by cycle 0.0.2.
#
# `tests/probe/` held 23 files of two kinds: 16 carry `expect-exit:` and 7 carry
# `expect-error:` -- they are refusals, and being refused is the whole point of
# probe02b, probe09, probe12b and the four probe13s. NO SINGLE ENTRY CAN JUDGE
# THAT. Read in npkg/suites.npk at 950bb1d:
#   * `files_of` (:549) takes `path`/`paths` as DIRECTORIES and lists files by
#     suffix; `recursive` defaults false, so a subdirectory is EXCLUDED -- which
#     is what makes the two entries below disjoint without listing a file.
#   * `run_program` (:779) judges every file it finds, skipping only those
#     imported by another; it does NOT skip a file carrying `expect-error`, so
#     the 7 refusals would have been built as programs and failed.
#   * `run_compile` (:608) does not filter by expectation either -- `kind`
#     selects the checker, not the file set.
#
# So the 7 moved to `tests/probe/refused/`, the compiler's own convention of a
# directory per kind. Cycle 0.0.0's execution record cites their old paths and
# is a verified artifact that is not rewritten; `meta/roadmap/0.0/0.0.2.md` has
# the redirect table, in the pattern RX-114 established for the O-G renumbering.

[[test]]
name  = "probe"
stage = "program"
path  = "tests/probe"              # the 16 that compile, link and run

[[test]]
name  = "probe-refused"
stage = "compile"
kind  = "negative"
path  = "tests/probe/refused"      # the 7 that are refused BY NAME (B-7, D-237)
