# nregex CI.
#
# EVERY INPUT IS PINNED, AND THE PIN IS ENFORCED RATHER THAN REQUESTED (P-9,
# D-204: the toolchain is a build input). The compiler is a COMMIT, never a
# branch: `nitpick` is moving through its cycle 1.5, and a library whose CI
# tracks another repository's `main` is a library whose CI goes red for reasons
# that are not its own. Bumping either pin is a deliberate commit, and the
# commit that bumps it is the one that runs the full suite.
#
# WHAT THIS PROVES, UPDATED 2026-09-06 BY CYCLE 0.0.5. A green run is evidence
# that the pinned compiler builds from a clean checkout, that LLVM is exactly
# 20.1.2, and that all 98 declared units build, link, run and are judged by
# their exit codes — 19 probes twice each at -O0 and through `opt -O2`, 6
# refusal probes held to their exact code sets, 13 `src/core/` unit programs,
# 1 conformance program, 2 rejection fixtures, and a 57-file sweep of every
# `.npk` in the tree as a root.
# SIX tree checks run on every invocation — five that can fail the run and
# `check_specs_current`, which reports. AND SINCE 0.0.3 IT IS ALSO EVIDENCE
# THAT THE RUNNER CAN FAIL: the self-check runs FIRST and feeds it eight kinds
# of wrong expectation, requiring a red for each. Three more of V-20's eleven
# cases print as PENDING on stages that do not exist until 0.3, 0.5 and 0.8, so
# the green covers eight of the eleven ways the harness is meant to fail and
# says so. It is still NOT evidence about this library's BEHAVIOUR: `src/core/`
# is real and carries its own suites, but nothing matches yet.
#
# THESE COUNTS WENT STALE ONCE AND THE STALENESS WAS INVISIBLE (cycle 0.0.5).
# They read "67 declared units … a 39-file sweep … Four tree checks" — the
# composition before `src/core/` landed 13 unit programs, 18 more files for the
# parse sweep, and `check_no_division`. The count then moved AGAIN inside the
# very subcycle that corrected it, when `check_accessor_confinement` landed —
# which is the argument, not a footnote to it. Nothing failed: the harness prints its
# own totals and this comment is prose, so the two disagreed silently for a
# whole subcycle. The number that is CHECKED is the one the runner prints; the
# number a reader believes is this one. Re-derive these from a green run's
# summary rather than by adding to them.
#
# THE COMPILER CI BUILDS IS NOT BYTE-IDENTICAL TO THE ONE THIS WORKBENCH PINS,
# AND THAT IS NOT A DEFECT. The pinned commit's own subject records it: at
# `3d15ac9` the compiler side measured that `build/npkc` differs between a
# developer machine and GitHub's runner while `npkrt.o` is identical, because
# D-204's pin is a VERSION and a version is not a binary. The property that
# holds across machines is the EMISSION — `build/npkc.ll` — and a difference
# THERE would be a compiler defect. So a local `npkc` sha that disagrees with
# the runner's is expected; do not raise it.
#
# FIRST GREEN: run 33835762747, 2026-09-04, on `main` at c7b8711, 8m48s.
#
# KNOWN MAINTENANCE ITEM, from that same run. GitHub annotates it:
#   "Node.js 20 is deprecated. The following actions target Node.js 20 but are
#    being forced to run on Node.js 24: actions/cache@v4, actions/checkout@v4."
# Nothing is broken — the run is green and the runner is already forcing Node
# 24 — and there is nothing to do today. It stops being a warning and becomes
# a failure when the forcing ends, and the fix is to bump both actions to a
# release built for Node 24. Worth writing down HERE, next to the pins, for one
# reason: `@v4` is a moving tag, so these two actions are the only inputs in
# this file NOT pinned to something immutable. A workflow this insistent about
# pinning a compiler by sha and LLVM by patch release should not be surprised
# when the parts it left on a floating tag roll forward underneath it.

name: nregex

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ../BOARD.md's pinned toolchain, by FULL sha. `3d15ac9` is the short form
  # used in the roadmap and the transcripts.
  #
  # BUMPED 2026-09-06 FROM `950bb1d`, WHICH WAS 57 COMMITS AND TWO RE-PINS
  # STALE AND HAD BEEN RED FOR TWO DAYS. The red was this library's tests
  # against an old compiler, not a defect: cycle 0.0.3 added derive probes that
  # `950bb1d` refuses `NITPICK-TYPE-034`, because it predates the fix for
  # workbench registry O-N10. Reproduced locally against three kept pins before
  # this line moved -- `950bb1d` 60/63, `94874ce` 63/63, `3d15ac9` 61/63 and
  # then 67/67 once the two commits before this one landed. A CI pin that lags
  # the pin the work is done against does not test the library; it tests the
  # gap.
  NITPICK_COMMIT: 3d15ac92d51bfca9079d8a28808c2d9db0dab51e
  # nitpick.toml [toolchain] llvm. Exact patch release: a patch may change
  # instruction selection, which is why the manifest names three digits.
  LLVM_VERSION: 20.1.2

jobs:
  build:
    # Pinned, not `ubuntu-latest`, for the same reason the compiler is pinned by
    # commit: a runner image that rolls forward is an unpinned build input.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out nregex
        uses: actions/checkout@v4

      - name: Check out the pinned compiler
        uses: actions/checkout@v4
        with:
          repository: alternative-intelligence-cp/nitpick
          ref: ${{ env.NITPICK_COMMIT }}
          path: .nitpick

      # The upstream release tarball, because apt.llvm.org packages by MAJOR
      # version and would give whatever 20.1.x is current. ~2 GB, so it is
      # cached on the version alone — the asset is immutable for a given tag.
      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/llvm
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C ~/llvm

      - name: Put LLVM on PATH and assert the pin
        run: |
          set -euo pipefail
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/llvm/bin:$PATH"
          have="$(llvm-config --version)"
          # An assertion, not a report. The whole point of naming a patch
          # release is that a different one fails here rather than silently
          # producing different code.
          if [ "$have" != "$LLVM_VERSION" ]; then
            echo "LLVM is $have; nitpick.toml pins $LLVM_VERSION exactly." >&2
            exit 1
          fi
          echo "llvm-config --version == $have"

      # Keyed on the compiler's commit, so a cache hit is by construction the
      # right binary. The compiler's own bootstrap ladder is the only supported
      # way to build it; `quickemit.py` leaves both artefacts this library needs
      # — `npkc` and `npkrt.o` — in `.internal/quickemit/`.
      - name: Cache the built compiler
        id: npkc-cache
        uses: actions/cache@v4
        with:
          path: .nitpick/.internal/quickemit
          key: npkc-${{ env.NITPICK_COMMIT }}-llvm-${{ env.LLVM_VERSION }}

      - name: Build the compiler from the pinned commit
        if: steps.npkc-cache.outputs.cache-hit != 'true'
        working-directory: .nitpick
        run: |
          set -euo pipefail
          python3 bootstrap/harness/quickemit.py --keep npkg/main.npk

      - name: Check the toolchain artefacts exist
        run: |
          set -euo pipefail
          test -f .nitpick/.internal/quickemit/npkc
          test -f .nitpick/.internal/quickemit/npkrt.o
          echo "NPKC=$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkc"   >> "$GITHUB_ENV"
          echo "NPKRT=$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkrt.o" >> "$GITHUB_ENV"

      # THE CROSS-MACHINE MEASUREMENT THE COMPILER SIDE ASKED THIS WORKBENCH FOR
      # (its OPEN_DECISIONS S-42, recommendation (c); BUILD_REFERENCE.md §5).
      #
      # IT PRINTS AND ASSERTS NOTHING, DELIBERATELY. The comparison belongs to
      # whoever holds both numbers; a workflow that failed on a digest it has
      # never been told the expected value of would be asserting a guess.
      #
      # WHAT IS AND IS NOT A CROSS-MACHINE CLAIM. The compiler's `npkc` BINARY
      # is not one — S-42 measured it differing between this workbench and a
      # runner because D-204's pin is a VERSION of LLVM and a version is not a
      # binary. The EMISSION is: same source, same committed snapshot builder,
      # same text anywhere (D-078, D-236). A difference in the emission would be
      # a compiler defect; a difference in the binary is expected.
      #
      # WHY THE PATH BELOW IS NOT `build/npkc.ll`. That is what `npkg build`
      # writes, and this workflow does not run `npkg build` — it runs the
      # bootstrap harness's `quickemit.py`, which has the same snapshot builder
      # compile the same entry file (`harness.EMIT_CHECK` is `src/npkc.npk`) and
      # leaves the result as `npkc.ll` in `.internal/quickemit/`. Same source,
      # same builder, different output directory; the output directory does not
      # enter the IR. If the two ever disagree, that difference is the finding.
      #
      # AND THE EMISSION REALLY IS INVOCATION-INDEPENDENT — measured here at
      # cycle 0.0.5 against the pinned npkc rather than taken from the compiler's
      # word for it (RX-133). D-236 renders every site-table path relative to the
      # MANIFEST ROOT — the directory holding `nitpick.toml`, walked up to from
      # the main file — so the same file compiled from three different working
      # directories, by absolute and by relative argument, emits byte-identical
      # IR; only the file's position INSIDE its own tree changes it. That is what
      # makes comparing this digest across two machines legitimate, and it is a
      # sharper statement than "an emitted .ll is path-dependent": it is
      # tree-position-dependent and invocation-independent.
      #
      # It runs on a cache hit too, because `npkc.ll` is inside the cached
      # directory and a cached artefact is still the artefact built at this pin.
      - name: The compiler's emission, digested for cross-machine comparison
        working-directory: .nitpick
        run: |
          set -euo pipefail
          cd .internal/quickemit
          echo "compiler pin: $NITPICK_COMMIT"
          echo "the cross-machine claim is npkc.ll and nothing else on this list:"
          # Every artefact the ladder leaves, so the FIRST digest that differs
          # names the stage (S-42). Size beside the digest: two files that differ
          # in length differ for a reason a digest alone will not tell you.
          for f in builder.o builder npkrt.o npkc.ll npkc.o npkc; do
            if [ -f "$f" ]; then
              printf '%-12s %10s bytes  %s\n' \
                "$f" "$(stat -c '%s' "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            else
              printf '%-12s %s\n' "$f" "absent"
            fi
          done

      - name: Run the harness
        run: python3 harness/run.py

      # Not part of the harness yet — 0.0.2 owns the stages. Until then this is
      # the one thing 0.0.1 established, run explicitly so that CI is not green
      # over nothing: the consumer compiles, links, RUNS and exits 0. `npkc`
      # exiting 0 does not mean a program is well-formed (registry O-N11), so
      # all four steps are run and the last one is what is judged.
      - name: The conformance consumer, all four steps
        run: |
          set -euo pipefail
          "$NPKC" tests/conformance/import.npk -o import.ll
          llc -O0 -filetype=obj -relocation-model=static import.ll -o import.o
          ld.lld -static import.o "$NPKRT" -o import
          ./import
          echo "tests/conformance/import.npk -> exit 0"
